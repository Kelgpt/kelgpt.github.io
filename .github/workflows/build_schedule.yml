name: schedule builds

on:
  schedule:
    - cron: "0 */3 * * *" # Run every 3 hours
  push:
    branches:
      - main
    paths:
      - "_blog/**"
      - "_product/**"
      - "_news/**"
      - "!assets/**"
      - "!_drafts/**"
      - "assets/scripts/move_future_posts.rb" # Explicitly include the script
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Debug Information
        run: |
          echo "Event name: ${{ github.event_name }}"
          echo "Branch name: ${{ github.ref }}"
          echo "Workflow triggered at: $(date -u)"
          echo "Commit SHA: ${{ github.sha }}"
          echo "Repository: ${{ github.repository }}"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Install dependencies
        run: |
          bundle config set --local path 'vendor/bundle'
          bundle install --verbose

      - name: Move draft posts
        run: |
          if [ -f "${{ github.workspace }}/assets/scripts/move_future_posts.rb" ]; then
            ruby ${{ github.workspace }}/assets/scripts/move_future_posts.rb
          else
            echo "Error: move_future_posts.rb script not found!"
            exit 1
          fi

      - name: Check for changes
        id: check-for-changes
        run: |
          git status
          if git diff --quiet; then
            echo "No changes detected."
            echo "changes_detected=false" >> $GITHUB_ENV
          else
            echo "Changes detected:"
            git diff --stat
            echo "changes_detected=true" >> $GITHUB_ENV
          fi

      - name: Commit changes
        if: env.changes_detected == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Move draft post(s) to live folder [skip ci]" || echo "No changes to commit"

      - name: Push changes
        if: env.changes_detected == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push || {
            echo "Push failed. Attempting to pull and push again..."
            git pull --rebase
            git push
          }

      - name: Cleanup before build
        if: env.changes_detected == 'true'
        run: |
          rm -rf _site .jekyll-cache
          bundle exec jekyll clean

      - name: Build site
        if: env.changes_detected == 'true'
        run: |
          echo "Starting Jekyll build..."
          bundle exec jekyll build
          echo "Jekyll build completed"

      - name: Verify Netlify CLI
        if: env.changes_detected == 'true'
        run: |
          npm install -g netlify-cli
          npx netlify -v

      - name: Deploy to Netlify
        if: env.changes_detected == 'true'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          npx netlify deploy --dir=_site --prod --site $NETLIFY_SITE_ID --auth $NETLIFY_AUTH_TOKEN

      - name: Workflow Status
        if: always()
        run: |
          echo "Workflow completed at: $(date -u)"
          echo "Final status: ${{ job.status }}"
