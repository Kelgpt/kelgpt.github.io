# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: Your awesome title
editor-email: editors@racket-review.com
feedback-email: feedback@racket-review.com
confidential-tip-email: ""
description: "Welcome to Racket Review, your go-to source for badminton equipment reviews."
baseurl: "" # the subpath of your site, e.g. /blog
url: "kelgpt.github.io" # the base hostname & protocol for your site, e.g. http://example.com
twitter_username: jekyllrb
github_username: jekyll

collections:
  blog:
    output: true
    permalink: /_blog/:path/
  product:
    output: true
    permalink: /_equipment/:path/
  news:
    output: true
    permalink: /_news/:path/
  drafts:
    output: false

future: false
# change future to true if you want to show future post
# Build settings
# theme: minima
plugins:
  - jekyll-feed
  - jekyll-paginate-v2
  - jekyll-admin

# Exclude from processing.

# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - _drafts/
  - post_template/

############################################################
# Site configuration for the Jekyll Pagination Gem
# This section configures pagination for the collections
############################################################
pagination:
  enabled: true # Enable pagination
  # collection: "blog" # The collection to paginate (change this for other collections)
  # per_page: 5 # Number of posts per page
  # permalink: "/:num/" # Permalink structure for paginated pages
  sort_field: "date" # Field to sort by
  sort_reverse: true # Sort in descending order
  # trail:
  #   before: 2 # Number of pages to show before the current page in the pagination trail
  #   after: 2 # Number of pages to show after the current page in the pagination trail
